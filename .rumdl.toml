[global]
flavor = "gfm"
# Do not hard-wrap prose, tables, or copyable shell commands.
disable = ["MD013"]
respect-gitignore = true
include = ["README.md", "AGENTS.md", "backlog/**/*.md", "docs/content/docs/**/*.mdx"]
exclude = [".pixi/**", "**/node_modules/**", "docs/.next/**", "docs/.source/**", "docs/out/**", ".vale/**"]

[per-file-flavor]
"docs/content/docs/**/*.mdx" = "mdx"

# Backlog titles are metadata; decision records also need a visible Markdown H1.
[MD025]
front-matter-title = ""
