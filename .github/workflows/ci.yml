name: Template CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94
        with:
          run-install: false
      - run: pixi install --locked
      - run: pixi run --locked tools run documents --check
      - run: pixi run --locked tools run lint
      - run: pixi run tools run smoke
