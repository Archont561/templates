name: publish sandbox

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "publish-sandbox-${{ github.repository }}"
  cancel-in-progress: false

env:
  PIXI_SANDBOX_VERSION: 0.9.0

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fetch the pinned pixi-sandbox release
        shell: bash
        env:
          PIXI_SANDBOX_BIN: ${{ runner.temp }}/pixi-sandbox-bin/pixi-sandbox${{ runner.os == 'Windows' && '.exe' || '' }}
        # multiline-run-allowed: ADR-30 — the sole pre-CLI bootstrap; checksum-verified before PATH registration
        run: |
          set -euo pipefail
          case "$RUNNER_OS/$RUNNER_ARCH" in
            Linux/X64) asset=pixi-sandbox-x86_64-unknown-linux-musl ;;
            Linux/ARM64) asset=pixi-sandbox-aarch64-unknown-linux-musl ;;
            macOS/X64) asset=pixi-sandbox-x86_64-apple-darwin ;;
            macOS/ARM64) asset=pixi-sandbox-aarch64-apple-darwin ;;
            Windows/X64) asset=pixi-sandbox-x86_64-pc-windows-msvc.exe ;;
            *) echo "::error::unsupported runner: $RUNNER_OS/$RUNNER_ARCH"; exit 1 ;;
          esac
          base="https://github.com/Archont561/pixi-sandbox/releases/download/v$PIXI_SANDBOX_VERSION"
          stage=$(mktemp -d)
          trap 'rm -rf "$stage"' EXIT
          curl --proto '=https' --proto-redir '=https' --tlsv1.2 --fail --silent --show-error --location --retry 3 --output "$stage/$asset" "$base/$asset"
          curl --proto '=https' --proto-redir '=https' --tlsv1.2 --fail --silent --show-error --location --retry 3 --output "$stage/SHA256SUMS" "$base/SHA256SUMS"
          digest=$(awk -v name="$asset" '{ sub(/\r$/, ""); if ($2 == name || $2 == "*" name) { if (NF == 2) print $1; else print "invalid" } }' "$stage/SHA256SUMS")
          [[ "$digest" =~ ^[[:xdigit:]]{64}$ ]] || { echo "::error::missing, duplicate or malformed checksum for $asset"; exit 1; }
          printf '%s  %s\n' "$digest" "$asset" > "$stage/selected.sha256"
          (cd "$stage"; if command -v sha256sum >/dev/null 2>&1; then sha256sum --check selected.sha256; else shasum -a 256 --check selected.sha256; fi)
          chmod +x "$stage/$asset"
          mkdir -p "$(dirname "$PIXI_SANDBOX_BIN")"
          mv "$stage/$asset" "$PIXI_SANDBOX_BIN"
          printf '%s\n' "$(dirname "$PIXI_SANDBOX_BIN")" >> "$GITHUB_PATH"
      - id: plan
        shell: bash
        run: echo "matrix=$(pixi-sandbox plan --config pixi-sandbox.toml --json)" >> "$GITHUB_OUTPUT"

  publish:
    permissions:
      contents: write
    needs: plan
    strategy:
      fail-fast: false
      # `include:` nested under `matrix:`, not `matrix:` itself. `plan --json` emits
      # {"schema":1,"include":[...]}, and Actions requires strategy.matrix to be an object.
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix).include }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
        with:
          run-install: false
      - name: Fetch the pinned pixi-sandbox release
        shell: bash
        env:
          PIXI_SANDBOX_BIN: ${{ runner.temp }}/pixi-sandbox-bin/pixi-sandbox${{ runner.os == 'Windows' && '.exe' || '' }}
        # multiline-run-allowed: ADR-30 — the sole pre-CLI bootstrap; checksum-verified before PATH registration
        run: |
          set -euo pipefail
          case "$RUNNER_OS/$RUNNER_ARCH" in
            Linux/X64) asset=pixi-sandbox-x86_64-unknown-linux-musl ;;
            Linux/ARM64) asset=pixi-sandbox-aarch64-unknown-linux-musl ;;
            macOS/X64) asset=pixi-sandbox-x86_64-apple-darwin ;;
            macOS/ARM64) asset=pixi-sandbox-aarch64-apple-darwin ;;
            Windows/X64) asset=pixi-sandbox-x86_64-pc-windows-msvc.exe ;;
            *) echo "::error::unsupported runner: $RUNNER_OS/$RUNNER_ARCH"; exit 1 ;;
          esac
          base="https://github.com/Archont561/pixi-sandbox/releases/download/v$PIXI_SANDBOX_VERSION"
          stage=$(mktemp -d)
          trap 'rm -rf "$stage"' EXIT
          curl --proto '=https' --proto-redir '=https' --tlsv1.2 --fail --silent --show-error --location --retry 3 --output "$stage/$asset" "$base/$asset"
          curl --proto '=https' --proto-redir '=https' --tlsv1.2 --fail --silent --show-error --location --retry 3 --output "$stage/SHA256SUMS" "$base/SHA256SUMS"
          digest=$(awk -v name="$asset" '{ sub(/\r$/, ""); if ($2 == name || $2 == "*" name) { if (NF == 2) print $1; else print "invalid" } }' "$stage/SHA256SUMS")
          [[ "$digest" =~ ^[[:xdigit:]]{64}$ ]] || { echo "::error::missing, duplicate or malformed checksum for $asset"; exit 1; }
          printf '%s  %s\n' "$digest" "$asset" > "$stage/selected.sha256"
          (cd "$stage"; if command -v sha256sum >/dev/null 2>&1; then sha256sum --check selected.sha256; else shasum -a 256 --check selected.sha256; fi)
          chmod +x "$stage/$asset"
          mkdir -p "$(dirname "$PIXI_SANDBOX_BIN")"
          mv "$stage/$asset" "$PIXI_SANDBOX_BIN"
          printf '%s\n' "$(dirname "$PIXI_SANDBOX_BIN")" >> "$GITHUB_PATH"

      # One cross-platform step where the per-platform Bash/PowerShell twins used to be:
      # install each environment, pack, verify (budgets included), publish — with per-phase
      # outcome recording and a step summary on failure, all inside `pipeline`.
      - name: Pack, verify, and publish
        shell: bash
        env:
          PIXI_SANDBOX_PUSH_TOKEN: ${{ github.token }}
          PIXI_SANDBOX_BIN: ${{ runner.temp }}/pixi-sandbox-bin/pixi-sandbox${{ runner.os == 'Windows' && '.exe' || '' }}
        run: >-
          "$PIXI_SANDBOX_BIN" pipeline
          --envs "${{ matrix.environments }}"
          --platform "${{ matrix.platform }}"
          --branch "${{ matrix.branch }}"
          --remote "${{ github.server_url }}/${{ github.repository }}.git"
          --config pixi-sandbox.toml
          --cargo-vendor "${{ matrix.cargo_vendor }}"
          --transport-dir "${{ runner.temp }}/pixi-sandbox-transport"
          --log-dir "${{ runner.temp }}/pixi-sandbox-logs"

      - name: Upload publish diagnostic log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: publish-diagnostics-${{ matrix.platform }}
          path: ${{ runner.temp }}/pixi-sandbox-logs
          if-no-files-found: ignore
          retention-days: 7
