[workspace]
name = "templates"
version = "0.1.0"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = "3.12.*"
copier = ">=9,<10"
loguru = ">=0.7,<1"
jinja2 = ">=3.1,<4"
vale = ">=3,<4"
bun = ">=1.3,<2"

[pypi-dependencies]
tasknest = "==0.4.0"
rude-clean-code = "==0.4.0"
alint = "==0.22.1"
rumdl = ">=0.3.4, <0.4"

[tasks]
tools = "python -B -m tasknest"
docs-install = { cmd = "bun install --frozen-lockfile", cwd = "docs" }
docs-dev = { cmd = "bun run dev", cwd = "docs" }
docs-lint = { cmd = "bun run lint", cwd = "docs" }
docs-build = { cmd = "bun run build", cwd = "docs" }
